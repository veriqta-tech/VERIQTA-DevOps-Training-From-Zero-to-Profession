<svg xmlns="http://www.w3.org/2000/svg" width="900" height="409" viewBox="0 0 900 409"><style>text{font-family:Arial,sans-serif;fill:#163b36}.title{font-size:25px;font-weight:bold}.sub{font-size:15px}.small{font-size:14px}.mono{font-family:monospace;font-size:15px}.box{fill:#f1f7f5;stroke:#21705e;stroke-width:2}.accent{fill:#d9ece5;stroke:#21705e;stroke-width:2}.line{stroke:#21705e;stroke-width:2;fill:none}.muted{fill:#55716b}</style><rect width="900" height="409" fill="#ffffff"/><text class="title" x="36" y="42">Filesystem directories</text><rect class="box" x="36" y="77" width="828" height="54" rx="9"/><text class="mono" x="54" y="100">/</text><text class="small muted" x="54" y="120">Filesystem root</text><rect class="box" x="36" y="143" width="828" height="54" rx="9"/><text class="mono" x="54" y="166">/home  /root</text><text class="small muted" x="54" y="186">Home directories for regular users and root</text><rect class="box" x="36" y="209" width="828" height="54" rx="9"/><text class="mono" x="54" y="232">/etc  /var</text><text class="small muted" x="54" y="252">Configuration files and variable data</text><rect class="box" x="36" y="275" width="828" height="54" rx="9"/><text class="mono" x="54" y="298">/usr  /tmp</text><text class="small muted" x="54" y="318">Programs and temporary files</text><text class="sub muted" x="36" y="387">Read and inspect system paths; do not change them in this lab.</text><text x="12" y="400" font-family="Arial,sans-serif" font-size="11" fill="#55716b">VERIQTA DevOps Training  |  © 2026 VERIQTA LIMITED</text></svg>