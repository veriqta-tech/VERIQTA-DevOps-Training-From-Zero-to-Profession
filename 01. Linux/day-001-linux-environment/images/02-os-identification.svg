<svg xmlns="http://www.w3.org/2000/svg" width="900" height="343" viewBox="0 0 900 343"><style>text{font-family:Arial,sans-serif;fill:#163b36}.title{font-size:25px;font-weight:bold}.sub{font-size:15px}.small{font-size:14px}.mono{font-family:monospace;font-size:15px}.box{fill:#f1f7f5;stroke:#21705e;stroke-width:2}.accent{fill:#d9ece5;stroke:#21705e;stroke-width:2}.line{stroke:#21705e;stroke-width:2;fill:none}.muted{fill:#55716b}</style><rect width="900" height="343" fill="#ffffff"/><text class="title" x="36" y="42">Identify your Ubuntu version</text><rect class="box" x="36" y="77" width="828" height="54" rx="9"/><text class="mono" x="54" y="100">sudo apt update</text><text class="small muted" x="54" y="120">Refresh package lists, not installed packages</text><rect class="box" x="36" y="143" width="828" height="54" rx="9"/><text class="mono" x="54" y="166">cat /etc/os-release</text><text class="small muted" x="54" y="186">Read operating-system release information</text><rect class="box" x="36" y="209" width="828" height="54" rx="9"/><text class="mono" x="54" y="232">PRETTY_NAME=&quot;Ubuntu 26.04 LTS&quot;</text><text class="small muted" x="54" y="252">Observed OS release in original Day 001 session</text><text class="sub muted" x="36" y="321">Do not assume every Ubuntu machine uses this version.</text><text x="12" y="334" font-family="Arial,sans-serif" font-size="11" fill="#55716b">VERIQTA DevOps Training  |  © 2026 VERIQTA LIMITED</text></svg>