<svg xmlns="http://www.w3.org/2000/svg" width="900" height="343" viewBox="0 0 900 343"><style>text{font-family:Arial,sans-serif;fill:#163b36}.title{font-size:25px;font-weight:bold}.sub{font-size:15px}.small{font-size:14px}.mono{font-family:monospace;font-size:15px}.box{fill:#f1f7f5;stroke:#21705e;stroke-width:2}.accent{fill:#d9ece5;stroke:#21705e;stroke-width:2}.line{stroke:#21705e;stroke-width:2;fill:none}.muted{fill:#55716b}</style><rect width="900" height="343" fill="#ffffff"/><text class="title" x="36" y="42">Troubleshoot a missing command</text><rect class="box" x="36" y="77" width="828" height="54" rx="9"/><text class="mono" x="54" y="100">tree  →  command not found</text><text class="small muted" x="54" y="120">Observe and understand the error</text><rect class="box" x="36" y="143" width="828" height="54" rx="9"/><text class="mono" x="54" y="166">sudo apt install tree</text><text class="small muted" x="54" y="186">Install the missing Ubuntu utility</text><rect class="box" x="36" y="209" width="828" height="54" rx="9"/><text class="mono" x="54" y="232">tree ~/devops-training/01-linux</text><text class="small muted" x="54" y="252">Re-run the original command to verify the fix</text><text class="sub muted" x="36" y="321">Use least privilege; do not install unknown packages blindly.</text><text x="12" y="334" font-family="Arial,sans-serif" font-size="11" fill="#55716b">VERIQTA DevOps Training  |  © 2026 VERIQTA LIMITED</text></svg>