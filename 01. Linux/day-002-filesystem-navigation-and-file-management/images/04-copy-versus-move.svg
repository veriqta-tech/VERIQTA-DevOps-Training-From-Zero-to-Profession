<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="336" viewBox="0 0 1080 336" role="img" aria-label="Copy versus move"><rect width="1080" height="280" fill="#f8faf9"/><rect x="20" y="20" width="1040" height="240" rx="14" fill="#ffffff" stroke="#bfd3cd" stroke-width="2"/><rect x="20" y="20" width="1040" height="56" rx="14" fill="#125b4c"/><text x="40" y="56" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="white">Copy versus move</text><text x="40" y="102" font-size="19" font-family="Arial, sans-serif" fill="#12352f">notes/lesson.txt --cp--&gt; labs/lesson.txt</text><text x="40" y="139" font-size="19" font-family="Arial, sans-serif" fill="#12352f">Original stays in notes/</text><text x="40" y="176" font-size="19" font-family="Arial, sans-serif" fill="#12352f">labs/lesson.txt --mv--&gt; exercises/lesson.txt</text><text x="40" y="213" font-size="19" font-family="Arial, sans-serif" fill="#12352f">Moved file leaves labs/</text><text x="40" y="250" font-size="19" font-family="Arial, sans-serif" fill="#12352f">mv can also rename a file</text><rect x="0" y="280" width="1080" height="56" fill="#125b4c"/><text x="28" y="315" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">VERIQTA DevOps Training  |  © 2026 VERIQTA LIMITED</text></svg>