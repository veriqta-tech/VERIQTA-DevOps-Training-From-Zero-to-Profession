<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="280" viewBox="0 0 1080 280" role="img" aria-label="Interactive deletion workflow"><rect width="1080" height="280" fill="#f8faf9"/><rect x="20" y="20" width="1040" height="240" rx="14" fill="#ffffff" stroke="#bfd3cd" stroke-width="2"/><rect x="20" y="20" width="1040" height="56" rx="14" fill="#125b4c"/><text x="40" y="56" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="white">Interactive deletion workflow</text><text x="40" y="102" font-size="19" font-family="Arial, sans-serif" fill="#12352f">1. Create exercises/temporary.txt</text><text x="40" y="139" font-size="19" font-family="Arial, sans-serif" fill="#12352f">2. cat verifies the contents</text><text x="40" y="176" font-size="19" font-family="Arial, sans-serif" fill="#12352f">3. rm -i asks for confirmation</text><text x="40" y="213" font-size="19" font-family="Arial, sans-serif" fill="#12352f">4. Type y to confirm removal</text><text x="40" y="250" font-size="19" font-family="Arial, sans-serif" fill="#12352f">5. ls confirms only the target is gone</text></svg>