<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580">
<rect width="100%" height="100%" fill="#F7FBF9"/>
<rect x="0" y="0" width="1000" height="86" fill="#0D4937"/>
<text x="34" y="38" font-family="Arial" font-weight="bold" font-size="27" fill="white">Counting an unsorted severity file</text>
<text x="34" y="68" font-family="Arial" font-size="17" fill="#C7E7D7">VERIQTA DevOps Training • Classroom Diagram</text>
<rect x="30" y="106" width="940" height="87" rx="12" fill="white" stroke="#B2D8C7" stroke-width="2"/>
<circle cx="65" cy="149" r="21" fill="#147955"/>
<text x="65" y="156" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">1</text>
<text x="105" y="140" font-family="Arial" font-size="23" font-weight="bold" fill="#123F32">Original sample</text>
<text x="105" y="170" font-family="Arial" font-size="18" fill="#284C40">10 records in severity.txt, including nonadjacent duplicates</text>
<rect x="30" y="211" width="940" height="87" rx="12" fill="white" stroke="#B2D8C7" stroke-width="2"/>
<circle cx="65" cy="254" r="21" fill="#147955"/>
<text x="65" y="261" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">2</text>
<text x="105" y="245" font-family="Arial" font-size="23" font-weight="bold" fill="#123F32">sort severity.txt</text>
<text x="105" y="275" font-family="Arial" font-size="18" fill="#284C40">Group identical severity values together</text>
<rect x="30" y="316" width="940" height="87" rx="12" fill="white" stroke="#B2D8C7" stroke-width="2"/>
<circle cx="65" cy="359" r="21" fill="#147955"/>
<text x="65" y="366" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">3</text>
<text x="105" y="350" font-family="Arial" font-size="23" font-weight="bold" fill="#123F32">uniq -c</text>
<text x="105" y="380" font-family="Arial" font-size="18" fill="#284C40">3 ERROR   |   5 INFO   |   2 WARN</text>
<rect x="30" y="421" width="940" height="87" rx="12" fill="white" stroke="#B2D8C7" stroke-width="2"/>
<circle cx="65" cy="464" r="21" fill="#147955"/>
<text x="65" y="471" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">4</text>
<text x="105" y="455" font-family="Arial" font-size="23" font-weight="bold" fill="#123F32">Compare with uniq -c severity.txt</text>
<text x="105" y="485" font-family="Arial" font-size="18" fill="#284C40">Unsorted input produces counts for runs, not global totals</text>
<text x="32" y="563" font-family="Arial" font-size="15" fill="#41695B">Check counts sum to 10 before using them in a report.</text>
</svg>