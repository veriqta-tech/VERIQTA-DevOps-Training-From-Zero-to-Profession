<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f3f8f5"/><rect width="1080" height="162" fill="#0e4b37"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="white">VERIQTA DevOps Training</text><text x="60" y="128" font-family="Arial,sans-serif" font-size="27" fill="#d5ece2">Linux Day 003 · Follow-along reference</text><text x="64" y="220" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#123f30">Run a Bash Script</text><rect x="64" y="260" width="952" height="200" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="315" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">1. Write the script</text><text x="100" y="362" font-family="Arial,sans-serif" font-size="27" fill="#263d35">#!/bin/bash</text><text x="100" y="406" font-family="Arial,sans-serif" font-size="27" fill="#263d35">echo "Welcome to VERIQTA DevOps Training"</text><rect x="64" y="486" width="952" height="200" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="541" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">2. Inspect</text><text x="100" y="588" font-family="Arial,sans-serif" font-size="27" fill="#263d35">cat hello.sh</text><text x="100" y="632" font-family="Arial,sans-serif" font-size="27" fill="#263d35">ls -l hello.sh</text><rect x="64" y="712" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="767" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">3. Add owner execute</text><text x="100" y="814" font-family="Arial,sans-serif" font-size="27" fill="#263d35">chmod u+x hello.sh</text><rect x="64" y="894" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="949" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">4. Run</text><text x="100" y="996" font-family="Arial,sans-serif" font-size="27" fill="#263d35">./hello.sh</text><text x="64" y="1298" font-family="Arial,sans-serif" font-size="25" fill="#497265">Inspect before executing</text></svg>
