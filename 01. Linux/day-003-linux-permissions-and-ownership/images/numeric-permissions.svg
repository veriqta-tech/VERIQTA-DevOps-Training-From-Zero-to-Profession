<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f3f8f5"/><rect width="1080" height="162" fill="#0e4b37"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="white">VERIQTA DevOps Training</text><text x="60" y="128" font-family="Arial,sans-serif" font-size="27" fill="#d5ece2">Linux Day 003 · Follow-along reference</text><text x="64" y="220" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#123f30">Numeric chmod</text><rect x="64" y="260" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="315" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Values</text><text x="100" y="362" font-family="Arial,sans-serif" font-size="27" fill="#263d35">read = 4    write = 2    execute = 1</text><rect x="64" y="442" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="497" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Owner: 6</text><text x="100" y="544" font-family="Arial,sans-serif" font-size="27" fill="#263d35">4 + 2 = rw-</text><rect x="64" y="624" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="679" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Group: 4</text><text x="100" y="726" font-family="Arial,sans-serif" font-size="27" fill="#263d35">4 = r--</text><rect x="64" y="806" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="861" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Others: 0</text><text x="100" y="908" font-family="Arial,sans-serif" font-size="27" fill="#263d35">0 = ---</text><rect x="64" y="988" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="1043" font-family