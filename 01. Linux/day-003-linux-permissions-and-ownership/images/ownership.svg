<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f3f8f5"/><rect width="1080" height="162" fill="#0e4b37"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="white">VERIQTA DevOps Training</text><text x="60" y="128" font-family="Arial,sans-serif" font-size="27" fill="#d5ece2">Linux Day 003 · Follow-along reference</text><text x="64" y="220" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#123f30">Users and Groups</text><rect x="64" y="260" width="952" height="200" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="315" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Identity</text><text x="100" y="362" font-family="Arial,sans-serif" font-size="27" fill="#263d35">whoami → ubuntu</text><text x="100" y="406" font-family="Arial,sans-serif" font-size="27" fill="#263d35">id → user ID and group IDs</text><rect x="64" y="486" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="541" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">File ownership</text><text x="100" y="588" font-family="Arial,sans-serif" font-size="27" fill="#263d35">Owner: ubuntu    Group: ubuntu</text><rect x="64" y="668" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="723" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Verify</text><text x="100" y="770" font-family="Arial,sans-serif" font-size="27" fill="#263d35">stat -c "%U %G %a" app.conf</text><rect x="64" y="850" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="905" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Safety</text><text x="100" y="952" font-family="Arial,sans-serif" font-size="27" fill="#263d35">Use sudo only when required</text><text x="64" y="1298" font-family="Arial,sans-serif" font-size="25" fill="#497265">Inspect with id and stat</text></svg>
