<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f3f8f5"/><rect width="1080" height="162" fill="#0e4b37"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="white">VERIQTA DevOps Training</text><text x="60" y="128" font-family="Arial,sans-serif" font-size="27" fill="#d5ece2">Linux Day 003 · Follow-along reference</text><text x="64" y="220" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#123f30">Read the Permission String</text><rect x="64" y="260" width="952" height="156" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="315" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">File type</text><text x="100" y="362" font-family="Arial,sans-serif" font-size="27" fill="#263d35">- = regular file    d = directory    l = symbolic link</text><rect x="64" y="442" width="952" height="200" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="497" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Owner | Group | Others</text><text x="100" y="544" font-family="Arial,sans-serif" font-size="27" fill="#263d35">- rw- r-- r--</text><text x="100" y="588" font-family="Arial,sans-serif" font-size="27" fill="#263d35">  type   owner   group   others</text><rect x="64" y="668" width="952" height="200" rx="26" fill="#ffffff" stroke="#d3e3dc" stroke-width="2"/><text x="100" y="723" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#104a36">Permission bits</text><text x="100" y="770" font-family="Arial,sans-serif" font-size="27" fill="#263d35">r = read    w = write    x = execute</text><text x="100" y="814" font-family="Arial,sans-serif" font-size="27" fill="#263d35">- = permission not granted</text><text x="64" y="1298" font-family="Arial,sans-serif" font-size="25" fill="#497265">Inspect with ls -l</text></svg>
